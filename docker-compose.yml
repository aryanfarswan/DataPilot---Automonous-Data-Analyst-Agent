services:

  postgres:
    image: postgres:17-alpine
    container_name: datapilot_postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autonomous_data_analyst

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autonomous_data_analyst"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: datapilot_backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/autonomous_data_analyst

      GROQ_API_KEY: ${GROQ_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.8-flash}

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: datapilot_frontend
    restart: unless-stopped

    ports:
      - "8501:8501"

    environment:
      BACKEND_URL: http://backend:8000
      APP_HOST: 0.0.0.0
      APP_PORT: 8501

    depends_on:
      - backend


volumes:
  postgres_data:
    driver: local